<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFE Ядран — Дашборд медицинского представителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#EFF3F2; --line:#DCE4E2;
  --ink:#10201D; --muted:#5B6B68; --muted-2:#8A9794;
  --teal:#0E7C7B; --teal-dk:#0A5F5E; --teal-tint:#E4F2F1;
  --amber:#C6790A; --amber-tint:#FBEDD9;
  --a:#1E8F5F; --a-tint:#E4F5EC;
  --b:#2F6FED; --b-tint:#E8EFFE;
  --c:#C6790A; --c-tint:#FBEDD9;
  --d:#8A9794; --d-tint:#EEF1F0;
  --danger:#C4432E;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,32,29,.06), 0 1px 8px rgba(16,32,29,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Manrope',system-ui,sans-serif; font-weight:800; letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:var(--teal-dk)}

/* ---------- Layout shell ---------- */
#app{display:flex; min-height:100vh}
.sidebar{
  width:248px; flex:none; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{padding:20px 18px 14px; border-bottom:1px solid var(--line)}
.brand .logo{display:flex; align-items:center; gap:9px}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--teal-dk));flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Manrope';font-weight:800;font-size:13px}
.brand .name{font-family:'Manrope';font-weight:800;font-size:15px}
.brand .sub{color:var(--muted-2);font-size:11.5px;margin-top:2px}

.territory-box{padding:14px 18px; border-bottom:1px solid var(--line)}
.territory-box label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); margin-bottom:5px; font-weight:600}
select, input[type=text], input[type=search]{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px;
}
select:focus, input:focus{outline:2px solid var(--teal); outline-offset:1px}
.territory-box select{margin-bottom:8px}
.territory-current{
  margin-top:6px; padding:8px 10px; background:var(--teal-tint); border-radius:8px;
  font-size:12.5px; color:var(--teal-dk); font-weight:600; display:none;
}
.territory-current.active{display:block}

nav.tabs{padding:10px 10px; flex:1; overflow-y:auto}
.tab-btn{
  width:100%; text-align:left; background:none; border:none; padding:9px 11px; margin-bottom:2px;
  border-radius:8px; color:var(--muted); font-family:inherit; font-size:13.5px; font-weight:500;
  cursor:pointer; display:flex; align-items:center; gap:9px;
}
.tab-btn .n{width:20px;height:20px;border-radius:5px;background:var(--surface-2);color:var(--muted-2);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:10.5px;flex:none}
.tab-btn:hover{background:var(--surface-2); color:var(--ink)}
.tab-btn.active{background:var(--teal); color:#fff}
.tab-btn.active .n{background:rgba(255,255,255,.25); color:#fff}
.tab-btn:disabled{opacity:.4; cursor:not-allowed}

.sidebar-foot{padding:12px 18px; border-top:1px solid var(--line); font-size:11px; color:var(--muted-2)}

.main{flex:1; min-width:0; padding:26px 32px 60px; max-width:1400px}
.topline{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; flex-wrap:wrap; gap:8px}
.topline h1{font-size:21px; margin:0}
.crumbs{color:var(--muted-2); font-size:12.5px}
.page-desc{color:var(--muted); font-size:13px; margin:2px 0 20px; max-width:760px}

.empty{
  border:1.5px dashed var(--line); border-radius:var(--radius); padding:48px 24px; text-align:center;
  color:var(--muted); background:var(--surface);
}
.empty b{color:var(--ink)}

/* ---------- Cards / KPIs ---------- */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
.kpi .v{font-family:'Manrope'; font-weight:800; font-size:24px; line-height:1}
.kpi .l{color:var(--muted); font-size:12px; margin-top:6px}
.kpi .v.tierA{color:var(--a)} .kpi .v.tierB{color:var(--b)} .kpi .v.amber{color:var(--amber)}

/* ---------- Filters bar ---------- */
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.filters input[type=search]{width:220px}
.chip-group{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  font-size:12.5px; cursor:pointer; color:var(--muted); font-weight:500; user-select:none;
}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.chip.tA.on{background:var(--a); border-color:var(--a)} .chip.tB.on{background:var(--b); border-color:var(--b)}
.chip.tC.on{background:var(--c); border-color:var(--c)} .chip.tD.on{background:var(--d); border-color:var(--d)}
.spacer{flex:1}
.small-btn{
  padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink);
}
.small-btn:hover{background:var(--surface-2)}
.small-btn.primary{background:var(--teal); color:#fff; border-color:var(--teal)}
.small-btn.primary:hover{background:var(--teal-dk)}

/* ---------- Table ---------- */
.tbl-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow)}
table{width:100%; border-collapse:collapse; font-size:13px}
thead th{
  text-align:left; padding:10px 12px; background:var(--surface-2); color:var(--muted); font-weight:600;
  font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line);
  cursor:pointer; white-space:nowrap; position:sticky; top:0;
}
thead th:hover{color:var(--ink)}
thead th.sorted{color:var(--teal-dk)}
tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--teal-tint)}
.addr-cell{max-width:280px}
.addr-main{font-weight:500}
.addr-sub{color:var(--muted-2); font-size:11.5px}
.net-badge{display:inline-block; padding:2px 7px; border-radius:5px; background:var(--surface-2); font-size:11px; color:var(--muted); font-weight:600}

/* score dial */
.dial{display:inline-flex; align-items:center; gap:8px}
.dial svg{display:block}
.dial .num{font-family:'IBM Plex Mono'; font-weight:600; font-size:12.5px}
.tier-pill{
  display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:6px;
  font-family:'Manrope'; font-weight:800; font-size:11px; color:#fff; flex:none;
}
.tier-pill.A{background:var(--a)} .tier-pill.B{background:var(--b)} .tier-pill.C{background:var(--c)} .tier-pill.D{background:var(--d)}

.target-toggle{display:flex; align-items:center; gap:7px; cursor:pointer}
.target-toggle input{width:16px; height:16px; accent-color:var(--teal); cursor:pointer}
.reco-hint{font-size:10.5px; padding:1px 6px; border-radius:5px; font-weight:600}
.reco-hint.yes{background:var(--a-tint); color:var(--a)}
.reco-hint.no{background:var(--d-tint); color:var(--muted-2)}

.pct-bar{display:flex; height:6px; width:70px; border-radius:3px; overflow:hidden; background:var(--surface-2)}
.pct-bar span{display:block; height:100%}

/* ---------- Sections / tabs content ---------- */
.section{margin-bottom:28px}
.section h2{font-size:15px; margin:0 0 12px}
.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
.card h3{margin:0 0 4px; font-size:13.5px}
.card .hint{color:var(--muted-2); font-size:12px; margin-bottom:12px}

/* bar rows for city/region breakdown */
.bar-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12.5px}
.bar-row .lbl{width:170px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink)}
.bar-row .track{flex:1; height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden}
.bar-row .fill{height:100%; border-radius:5px}
.bar-row .val{width:70px; text-align:right; font-family:'IBM Plex Mono'; color:var(--muted); flex:none; font-size:11.5px}

.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px}
.legend .sw{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:-1px}

.note{background:var(--amber-tint); border:1px solid #EFD6A6; color:#7A5106; border-radius:8px; padding:10px 13px; font-size:12.5px; margin-bottom:16px}
.note b{color:#5C3D00}
.note.info{background:var(--teal-tint); border-color:#BFE0DE; color:var(--teal-dk)}
.note.info b{color:var(--teal-dk)}

/* routing */
.route-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.route-item{
  display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
  border-radius:9px; padding:10px 12px;
}
.route-item .idx{width:24px;height:24px;border-radius:7px;background:var(--teal-tint);color:var(--teal-dk);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-weight:600;font-size:12px;flex:none}
.route-item .info{flex:1; min-width:0}
.route-item .addr{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.route-item .meta{color:var(--muted-2); font-size:11.5px}
.route-item .move{display:flex; gap:4px}
.icon-btn{
  width:26px; height:26px; border:1px solid var(--line); background:var(--surface); border-radius:6px;
  cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:13px;
}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}

/* loading */
.loading{display:flex; align-items:center; gap:10px; color:var(--muted); padding:40px; justify-content:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--teal);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C7D2CF;border-radius:5px}

footer.credit{margin-top:30px; color:var(--muted-2); font-size:11px}

@media(max-width:900px){
  #app{flex-direction:column}
  .sidebar{width:100%; height:auto; position:relative}
  .main{padding:18px}
  .grid-2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><div class="logo-mark">Я</div><div><div class="name">SFE Ядран</div><div class="sub">Дашборд медпредставителя</div></div></div>
    </div>
    <div class="territory-box">
      <label for="regionSel">Регион (территория)</label>
      <select id="regionSel"><option value="">Выберите регион…</option></select>
      <label for="citySel">Населённый пункт <span style="font-weight:400;color:var(--muted-2)">(опц.)</span></label>
      <select id="citySel" disabled><option value="">Все города региона</option></select>
      <div class="territory-current" id="territoryCurrent"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-tab="overview"><span class="n">1</span>Территория и точки</button>
      <button class="tab-btn" data-tab="map"><span class="n">2</span>Карта</button>
      <button class="tab-btn" data-tab="route"><span class="n">3</span>Маршрутизация</button>
      <button class="tab-btn" data-tab="segments"><span class="n">4</span>Сегментация</button>
      <button class="tab-btn" data-tab="abc"><span class="n">5</span>ABC/XYZ</button>
      <button class="tab-btn" data-tab="whitespace"><span class="n">6</span>Слепые зоны</button>
      <button class="tab-btn" data-tab="regions"><span class="n">7</span>Сравнение регионов</button>
    </nav>
    <div class="sidebar-foot">Перепись «Ядран», 1кв. 2026 · 86 227 точек · 90 регионов</div>
  </aside>

  <main class="main" id="main">
    <!-- content injected by JS -->
  </main>
</div>

<script>
/* ============================================================
   STATE
============================================================ */
const state = {
  index: null,           // _index.json
  region: null,          // selected region name
  city: null,            // selected city or null (all)
  data: [],              // records for selected region
  loading: false,
  tab: 'overview',
  targets: JSON.parse(localStorage.getItem('sfe_targets') || '{}'), // {id: true/false} user overrides
  sort: {key:'score', dir:-1},
  filter: {q:'', tiers:new Set(['A','B','C','D']), onlyTarget:false},
};

const TIER_COLOR = {A:'var(--a)', B:'var(--b)', C:'var(--c)', D:'var(--d)'};
const TIER_LABEL = {A:'Приоритет A', B:'Приоритет B', C:'Приоритет C', D:'Низкий приоритет'};

function fmtInt(n){ return new Intl.NumberFormat('ru-RU').format(n); }
function saveTargets(){ localStorage.setItem('sfe_targets', JSON.stringify(state.targets)); }
function isTargeted(rec){
  if(state.targets.hasOwnProperty(rec.id)) return state.targets[rec.id];
  return rec.tier === 'A'; // recommendation default (not persisted until user acts)
}
function isUserOverridden(rec){ return state.targets.hasOwnProperty(rec.id); }

/* ============================================================
   BOOTSTRAP
============================================================ */
async function boot(){
  const res = await fetch('data/_index.json');
  state.index = await res.json();
  const sel = document.getElementById('regionSel');
  state.index.forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r.slug; opt.textContent = `${titleCase(r.region)} (${fmtInt(r.count)})`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', onRegionChange);
  document.getElementById('citySel').addEventListener('change', onCityChange);

  document.getElementById('tabs').addEventListener('click', e=>{
    const btn = e.target.closest('.tab-btn');
    if(!btn || btn.disabled) return;
    state.tab = btn.dataset.tab;
    render();
  });

  render(); // initial (empty) render
}

function titleCase(s){
  return s.toLowerCase().replace(/(^|\s|-)([а-яa-z])/g, (m,p1,p2)=>p1+p2.toUpperCase());
}

async function onRegionChange(e){
  const slug = e.target.value;
  if(!slug){ state.region=null; state.data=[]; renderSidebarState(); render(); return; }
  const meta = state.index.find(r=>r.slug===slug);
  state.region = meta.region;
  state.city = null;
  state.loading = true;
  renderSidebarState();
  render();
  const res = await fetch(`data/${slug}.json`);
  state.data = await res.json();
  state.loading = false;

  const citySel = document.getElementById('citySel');
  citySel.innerHTML = '<option value="">Все города региона</option>';
  meta.cities.forEach(c=>{
    const opt = document.createElement('option'); opt.value=c; opt.textContent=titleCase(c);
    citySel.appendChild(opt);
  });
  citySel.disabled = false;
  renderSidebarState();
  render();
}
function onCityChange(e){ state.city = e.target.value || null; render(); }

function renderSidebarState(){
  const cur = document.getElementById('territoryCurrent');
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.disabled = !state.region && b.dataset.tab!=='regions';
    b.classList.toggle('active', b.dataset.tab===state.tab);
  });
  if(state.region){
    cur.classList.add('active');
    cur.textContent = `📍 ${titleCase(state.region)}${state.city? ' · '+titleCase(state.city):''}`;
  } else {
    cur.classList.remove('active');
  }
}

function currentSet(){
  let d = state.data;
  if(state.city) d = d.filter(r=>r.city===state.city);
  return d;
}

/* ============================================================
   RENDER ROUTER
============================================================ */
function render(){
  renderSidebarState();
  const main = document.getElementById('main');
  if(state.tab!=='regions' && !state.region){
    main.innerHTML = emptyState();
    return;
  }
  if(state.loading){
    main.innerHTML = `<div class="loading"><div class="spin"></div>Загрузка территории…</div>`;
    return;
  }
  const renderers = {
    overview: renderOverview, map: renderMap, route: renderRoute,
    segments: renderSegments, abc: renderAbc, whitespace: renderWhitespace, regions: renderRegions,
  };
  main.innerHTML = renderers[state.tab]();
  attachHandlersFor(state.tab);
}

function emptyState(){
  return `<div class="topline"><h1>SFE Ядран</h1></div>
  <p class="page-desc">Дашборд медицинского представителя на основе переписи аптек «Ядран» (1 кв. 2026, 86 227 точек).</p>
  <div class="empty"><b>Выберите регион (территорию/«брик»)</b> в панели слева, чтобы получить полный список точек с характеристиками, скорингом потенциала и планированием визитов.<br><br>
  <span style="font-size:12px">Отдельная разбивка по «брикам» в исходных данных отсутствует — территория определяется по региону и, опционально, населённому пункту.</span></div>`;
}

/* ============================================================
   SCORE DIAL (SVG)
============================================================ */
function dial(score, tier, size=30){
  const r = size/2 - 3, c = 2*Math.PI*r, off = c*(1-score/100);
  const color = TIER_COLOR[tier];
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="3"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="3"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

/* ============================================================
   TAB 1: OVERVIEW (territory + pharmacy table)
============================================================ */
function renderOverview(){
  const set = currentSet();
  const targetedCount = set.filter(isTargeted).length;
  const tierACount = set.filter(r=>r.tier==='A').length;
  const avgScore = set.length? (set.reduce((s,r)=>s+r.score,0)/set.length).toFixed(1) : '0';
  const overriddenCount = set.filter(isUserOverridden).length;

  return `
  <div class="topline">
    <h1>Территория и точки</h1>
    <span class="crumbs">${fmtInt(set.length)} аптек в выборке</span>
  </div>
  <p class="page-desc">Полный список точек территории с характеристиками из переписи и рекомендацией по включению в маршрут визитов. <b>Финальное решение о целевой точке — за вами</b>: снимайте или ставьте отметку «Целевая» в любой строке, система только подсвечивает рекомендацию на основе скоринга.</p>

  <div class="kpi-row">
    <div class="kpi"><div class="v">${fmtInt(set.length)}</div><div class="l">аптек на территории</div></div>
    <div class="kpi"><div class="v tierA">${fmtInt(tierACount)}</div><div class="l">приоритет A (рекомендовано)</div></div>
    <div class="kpi"><div class="v amber">${fmtInt(targetedCount)}</div><div class="l">отмечено как целевые сейчас</div></div>
    <div class="kpi"><div class="v">${avgScore}</div><div class="l">средний скоринг потенциала (0–100)</div></div>
    <div class="kpi"><div class="v">${fmtInt(overriddenCount)}</div><div class="l">ваших ручных корректировок</div></div>
  </div>

  <div class="filters">
    <input type="search" id="qSearch" placeholder="Поиск по адресу, сети, юрлицу…" value="${state.filter.q}">
    <div class="chip-group" id="tierChips">
      ${['A','B','C','D'].map(t=>`<span class="chip t${t} ${state.filter.tiers.has(t)?'on':''}" data-tier="${t}">${t} · ${TIER_LABEL[t].split(' ')[1]||''}</span>`).join('')}
    </div>
    <span class="chip ${state.filter.onlyTarget?'on':''}" id="onlyTargetChip">Только целевые</span>
    <div class="spacer"></div>
    <button class="small-btn" id="resetOverrides">Сбросить мои правки</button>
    <button class="small-btn primary" id="exportCsv">Экспорт CSV</button>
  </div>

  <div class="tbl-wrap"><div style="max-height:640px; overflow:auto">
  <table>
    <thead><tr>
      <th data-k="tier">Приор.</th>
      <th data-k="score">Скоринг</th>
      <th data-k="addr">Точка / адрес</th>
      <th data-k="net">Сеть</th>
      <th data-k="toRank">Категория ТО</th>
      <th data-k="chk">Ср. чек</th>
      <th data-k="lp">ЛП / БАД / прочее</th>
      <th data-k="target">Целевая</th>
    </tr></thead>
    <tbody id="ovBody"></tbody>
  </table>
  </div></div>
  <footer class="credit">Скоринг = взвешенная модель по категории валового ТО (50%), среднему чеку (25%), доле ЛП в ассортименте (15%), принадлежности к сети (10%). Пороги: A ≥70, B ≥50, C ≥30, D &lt;30.</footer>
  `;
}

function filteredSortedSet(){
  let set = currentSet().filter(r=>state.filter.tiers.has(r.tier));
  if(state.filter.q){
    const q = state.filter.q.toLowerCase();
    set = set.filter(r=> (r.addr+r.org+r.net+r.grp).toLowerCase().includes(q));
  }
  if(state.filter.onlyTarget) set = set.filter(isTargeted);
  const {key,dir} = state.sort;
  set = [...set].sort((a,b)=>{
    let va=a[key], vb=b[key];
    if(key==='target'){ va=isTargeted(a)?1:0; vb=isTargeted(b)?1:0; }
    if(key==='addr'){ va=a.addr; vb=b.addr; }
    if(typeof va==='string') return va.localeCompare(vb)*dir;
    return (va-vb)*dir;
  });
  return set;
}

function ovRowHtml(r){
  const targeted = isTargeted(r);
  const overridden = isUserOverridden(r);
  return `<tr>
    <td><span class="tier-pill ${r.tier}" title="${TIER_LABEL[r.tier]}">${r.tier}</span></td>
    <td><div class="dial">${dial(r.score,r.tier)}<span class="num">${r.score.toFixed(0)}</span></div></td>
    <td class="addr-cell"><div class="addr-main">${r.org}</div><div class="addr-sub">${r.addr}</div></td>
    <td>${r.net? `<span class="net-badge">${r.net}</span>`:'<span style="color:var(--muted-2)">независимая</span>'}</td>
    <td>${r.toCat}</td>
    <td class="mono">${fmtInt(r.chk)} ₽</td>
    <td>${assortBar(r)}</td>
    <td>
      <label class="target-toggle">
        <input type="checkbox" data-id="${r.id}" class="targetChk" ${targeted?'checked':''}>
        ${!overridden ? `<span class="reco-hint ${r.tier==='A'?'yes':'no'}">${r.tier==='A'?'реком.':'—'}</span>` : ''}
      </label>
    </td>
  </tr>`;
}
function assortBar(r){
  return `<div class="pct-bar" title="ЛП ${r.lp}% · БАД ${r.bad}% · прочее ${r.oth}%">
    <span style="width:${r.lp}%;background:var(--teal)"></span>
    <span style="width:${r.bad}%;background:var(--amber)"></span>
    <span style="width:${r.oth}%;background:var(--d)"></span>
  </div>`;
}

/* ============================================================
   TAB 2: MAP  (no geocoordinates in source data -> city-level "cartogram")
============================================================ */
function renderMap(){
  const set = currentSet();
  const byCity = groupBy(set, r=>r.city);
  const rows = Object.entries(byCity).map(([city,arr])=>({
    city, count:arr.length, avgScore: arr.reduce((s,r)=>s+r.score,0)/arr.length,
    tierA: arr.filter(r=>r.tier==='A').length
  })).sort((a,b)=>b.count-a.count).slice(0,40);
  const maxCount = Math.max(...rows.map(r=>r.count),1);

  return `
  <div class="topline"><h1>Карта территории</h1><span class="crumbs">${Object.keys(byCity).length} населённых пунктов</span></div>
  <p class="page-desc">Геокоординаты точек в исходных данных отсутствуют — точной карты с пинами построить нельзя. Ниже — распределение аптек и их потенциала по населённым пунктам территории (топ‑40 по числу точек), как замена географической карты.</p>
  <div class="note info"><b>Для точной карты</b> потребуется дообогатить перепись координатами (геокодирование по адресу) — это можно сделать отдельным шагом.</div>
  <div class="card">
    <h3>Точки по населённым пунктам</h3>
    <div class="hint">Длина полосы — число аптек; цвет сегмента — доля приоритета A</div>
    ${rows.map(r=>`
      <div class="bar-row">
        <div class="lbl">${titleCase(r.city)}</div>
        <div class="track"><div class="fill" style="width:${r.count/maxCount*100}%; background:linear-gradient(90deg, var(--a) ${r.tierA/r.count*100}%, var(--b) ${r.tierA/r.count*100}%)"></div></div>
        <div class="val">${r.count} (A:${r.tierA})</div>
      </div>`).join('')}
  </div>`;
}

/* ============================================================
   TAB 3: ROUTING (manual ordering of targeted points, one city at a time)
============================================================ */
function renderRoute(){
  const set = currentSet();
  const targeted = set.filter(isTargeted);
  const byCity = groupBy(targeted, r=>r.city);
  const cities = Object.keys(byCity).sort((a,b)=>byCity[b].length-byCity[a].length);
  const activeCity = state._routeCity && byCity[state._routeCity] ? state._routeCity : cities[0];
  let order = getRouteOrder(activeCity, byCity[activeCity]||[]);

  return `
  <div class="topline"><h1>Маршрутизация визитов</h1><span class="crumbs">${fmtInt(targeted.length)} целевых точек на территории</span></div>
  <p class="page-desc">Порядок объезда целевых точек в пределах одного населённого пункта. Координат в данных нет, поэтому расстояние не считается автоматически — расставьте порядок вручную (стрелками), ориентируясь на скоринг и знание местности.</p>
  ${targeted.length===0? `<div class="empty">Нет отмеченных целевых точек. Отметьте точки как «Целевая» на вкладке «Территория и точки», затем вернитесь сюда для планирования маршрута.</div>` : `
  <div class="filters">
    <label style="font-size:12.5px;color:var(--muted);font-weight:600">Населённый пункт:</label>
    <select id="routeCitySel">${cities.map(c=>`<option value="${c}" ${c===activeCity?'selected':''}>${titleCase(c)} (${byCity[c].length})</option>`).join('')}</select>
  </div>
  <ol class="route-list" id="routeList">
    ${order.map((r,i)=>`
      <li class="route-item" data-id="${r.id}">
        <div class="idx">${i+1}</div>
        <div class="info"><div class="addr">${r.org} — ${r.addr}</div><div class="meta">Скоринг ${r.score.toFixed(0)} · приоритет ${r.tier} · ${r.net||'независимая'}</div></div>
        <div class="move">
          <button class="icon-btn moveUp" ${i===0?'disabled':''} title="Выше">↑</button>
          <button class="icon-btn moveDown" ${i===order.length-1?'disabled':''} title="Ниже">↓</button>
        </div>
      </li>`).join('')}
  </ol>
  <div style="margin-top:14px"><button class="small-btn primary" id="exportRoute">Экспорт маршрута (CSV)</button></div>
  `}`;
}
function routeKey(city){ return `sfe_route_${state.region}_${city}`; }
function getRouteOrder(city, list){
  if(!city) return list;
  const saved = JSON.parse(localStorage.getItem(routeKey(city)) || 'null');
  if(saved){
    const map = Object.fromEntries(list.map(r=>[r.id,r]));
    const ordered = saved.map(id=>map[id]).filter(Boolean);
    list.forEach(r=>{ if(!ordered.includes(r)) ordered.push(r); });
    return ordered;
  }
  return [...list].sort((a,b)=>b.score-a.score);
}
function setRouteOrder(city, list){ localStorage.setItem(routeKey(city), JSON.stringify(list.map(r=>r.id))); }

/* ============================================================
   TAB 4: SEGMENTATION
============================================================ */
function renderSegments(){
  const set = currentSet();
  const byGroup = groupBy(set, r=>r.grp || 'Независимые / без группы');
  const groupRows = Object.entries(byGroup).map(([g,arr])=>({g,count:arr.length,avg:arr.reduce((s,r)=>s+r.score,0)/arr.length}))
    .sort((a,b)=>b.count-a.count).slice(0,15);
  const maxG = Math.max(...groupRows.map(r=>r.count),1);

  const profiles = set.map(r=>{
    if(r.lp>=r.bad && r.lp>=r.oth) return 'ЛП-доминанта';
    if(r.bad>=r.lp && r.bad>=r.oth) return 'БАД-доминанта';
    return 'Смешанный / прочее';
  });
  const profCounts = {};
  profiles.forEach(p=>profCounts[p]=(profCounts[p]||0)+1);
  const profColors = {'ЛП-доминанта':'var(--teal)','БАД-доминанта':'var(--amber)','Смешанный / прочее':'var(--d)'};

  return `
  <div class="topline"><h1>Сегментация точек</h1><span class="crumbs">${fmtInt(set.length)} точек</span></div>
  <p class="page-desc">Группировка территории по сетевой принадлежности и ассортиментному профилю — разные сегменты требуют разной тактики захода (переговоры с закупкой сети vs прямая работа с провизором).</p>
  <div class="grid-2">
    <div class="card">
      <h3>По сетевой группе («Ядран»)</h3>
      <div class="hint">Топ-15 групп по числу точек на территории</div>
      ${groupRows.map(r=>`
        <div class="bar-row">
          <div class="lbl">${r.g}</div>
          <div class="track"><div class="fill" style="width:${r.count/maxG*100}%;background:var(--teal)"></div></div>
          <div class="val">${r.count} · ${r.avg.toFixed(0)}</div>
        </div>`).join('')}
    </div>
    <div class="card">
      <h3>По ассортиментному профилю</h3>
      <div class="hint">Кто доминирует в структуре продаж точки</div>
      ${donut(profCounts, profColors)}
      <div class="legend">${Object.entries(profCounts).map(([k,v])=>`<span><span class="sw" style="background:${profColors[k]}"></span>${k}: ${v} (${(v/set.length*100).toFixed(0)}%)</span>`).join('')}</div>
    </div>
  </div>`;
}
function donut(counts, colors){
  const total = Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const r=54, c=2*Math.PI*r; let offset=0;
  const segs = Object.entries(counts).map(([k,v])=>{
    const frac=v/total, len=c*frac;
    const seg=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${colors[k]}" stroke-width="18"
      stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 70 70)"/>`;
    offset += len; return seg;
  }).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140">${segs}
    <circle cx="70" cy="70" r="${r-9}" fill="var(--surface)"/></svg>`;
}

/* ============================================================
   TAB 5: ABC / XYZ
============================================================ */
function renderAbc(){
  const set = [...currentSet()].sort((a,b)=>b.toVal-a.toVal || b.score-a.score);
  const total = set.reduce((s,r)=>s+r.toVal,0)||1;
  let cum=0;
  const withAbc = set.map(r=>{ cum+=r.toVal; const pct=cum/total; let abc = pct<=0.8?'A':pct<=0.95?'B':'C'; return {...r, abc}; });
  const counts = {A:0,B:0,C:0}; withAbc.forEach(r=>counts[r.abc]++);
  const colors = {A:'var(--a)',B:'var(--b)',C:'var(--d)'};

  return `
  <div class="topline"><h1>ABC/XYZ-анализ</h1><span class="crumbs">${fmtInt(set.length)} точек</span></div>
  <p class="page-desc">Классический ABC — по вкладу точки в совокупный товарооборот территории (категория валового ТО как прокси). Группа A — точки, дающие первые 80% товарооборота; B — следующие 15%; C — остальные 5%.</p>
  <div class="note"><b>XYZ-анализ недоступен на этих данных.</b> Он требует ряда продаж минимум за несколько периодов (для оценки стабильности спроса), а перепись — это снимок на один квартал. Во втором загруженном файле («Модель сегментации SFE Q3’25») такой ряд как раз есть (продажи по кварталам Q1–Q2 25 по двум продуктовым линиям) — если сопоставить его с этой территорией по адресам, XYZ можно будет посчитать. Скажите, если это нужно сделать следующим шагом.</div>
  <div class="grid-2">
    <div class="card">
      <h3>Распределение ABC по товарообороту</h3>
      ${donut(counts, colors)}
      <div class="legend">
        <span><span class="sw" style="background:var(--a)"></span>A — ${counts.A} точек (80% ТО)</span>
        <span><span class="sw" style="background:var(--b)"></span>B — ${counts.B} точек (15% ТО)</span>
        <span><span class="sw" style="background:var(--d)"></span>C — ${counts.C} точек (5% ТО)</span>
      </div>
    </div>
    <div class="card">
      <h3>Как читать</h3>
      <div class="hint" style="line-height:1.6">
        Группа <b style="color:var(--a)">A</b> — небольшое число точек с максимальным вкладом в оборот: приоритет по частоте визитов.<br><br>
        Группа <b style="color:var(--b)">B</b> — средний вклад, визиты по стандартному циклу.<br><br>
        Группа <b style="color:var(--d)">C</b> — минимальный вклад, визиты по остаточному принципу или через дистрибьютора.
      </div>
    </div>
  </div>`;
}

/* ============================================================
   TAB 6: WHITESPACE (high potential, not targeted)
============================================================ */
function renderWhitespace(){
  const set = currentSet().filter(r=> (r.tier==='A'||r.tier==='B') && !isTargeted(r));
  const sorted = [...set].sort((a,b)=>b.score-a.score);
  return `
  <div class="topline"><h1>Слепые зоны (whitespace)</h1><span class="crumbs">${fmtInt(sorted.length)} точек</span></div>
  <p class="page-desc">Точки с высоким расчётным потенциалом (приоритет A или B), которые сейчас <b>не отмечены как целевые</b>. Это кандидаты на добавление в маршрут — но решение по каждой остаётся за вами.</p>
  ${sorted.length===0? `<div class="empty">На выбранной территории нет высокопотенциальных точек вне маршрута — покрытие полное.</div>` : `
  <div class="tbl-wrap"><div style="max-height:600px;overflow:auto"><table>
    <thead><tr><th>Приор.</th><th>Скоринг</th><th>Точка / адрес</th><th>Сеть</th><th>Категория ТО</th><th>Целевая</th></tr></thead>
    <tbody>
      ${sorted.map(r=>`<tr>
        <td><span class="tier-pill ${r.tier}">${r.tier}</span></td>
        <td><div class="dial">${dial(r.score,r.tier)}<span class="num">${r.score.toFixed(0)}</span></div></td>
        <td class="addr-cell"><div class="addr-main">${r.org}</div><div class="addr-sub">${r.addr}</div></td>
        <td>${r.net?`<span class="net-badge">${r.net}</span>`:'независимая'}</td>
        <td>${r.toCat}</td>
        <td><label class="target-toggle"><input type="checkbox" data-id="${r.id}" class="targetChk"></label></td>
      </tr>`).join('')}
    </tbody>
  </table></div></div>`}`;
}

/* ============================================================
   TAB 7: REGION COMPARISON (uses only lightweight _index.json)
============================================================ */
function renderRegions(){
  const rows = [...state.index].sort((a,b)=>b.count-a.count);
  const maxCount = Math.max(...rows.map(r=>r.count));
  return `
  <div class="topline"><h1>Сравнение регионов</h1><span class="crumbs">90 регионов РФ</span></div>
  <p class="page-desc">Общая картина по всем регионам переписи — число точек, средний скоринг потенциала, доля приоритета A. Не требует выбора территории.</p>
  <div class="tbl-wrap"><div style="max-height:680px;overflow:auto"><table>
    <thead><tr><th>Регион</th><th>Точек</th><th>Средний скоринг</th><th>Приоритет A</th><th>Доля A</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr>
        <td>${titleCase(r.region)}</td>
        <td class="mono">${fmtInt(r.count)}</td>
        <td><div class="bar-row" style="padding:0"><div class="track" style="width:90px"><div class="fill" style="width:${r.avgScore}%;background:var(--teal)"></div></div><span class="mono" style="margin-left:8px">${r.avgScore}</span></div></td>
        <td class="mono">${fmtInt(r.tierA)}</td>
        <td class="mono">${(r.tierA/r.count*100).toFixed(0)}%</td>
      </tr>`).join('')}
    </tbody>
  </table></div></div>`;
}

/* ============================================================
   HELPERS
============================================================ */
function groupBy(arr, fn){
  const out={}; arr.forEach(x=>{ const k=fn(x); (out[k]=out[k]||[]).push(x); }); return out;
}
function toCsv(rows, cols){
  const head = cols.map(c=>c.h).join(';');
  const body = rows.map(r=>cols.map(c=>`"${(''+c.v(r)).replace(/"/g,'""')}"`).join(';')).join('\n');
  return head+'\n'+body;
}
function downloadCsv(content, filename){
  const blob = new Blob(['\uFEFF'+content], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================
   EVENT HANDLERS PER TAB
============================================================ */
function attachHandlersFor(tab){
  if(tab==='overview'){
    document.getElementById('ovBody').innerHTML = filteredSortedSet().map(ovRowHtml).join('');
    document.getElementById('qSearch').addEventListener('input', e=>{ state.filter.q = e.target.value; document.getElementById('ovBody').innerHTML = filteredSortedSet().map(ovRowHtml).join(''); bindRowChecks(); });
    document.querySelectorAll('#tierChips .chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const t = chip.dataset.tier;
        if(state.filter.tiers.has(t) && state.filter.tiers.size>1) state.filter.tiers.delete(t); else state.filter.tiers.add(t);
        render();
      });
    });
    document.getElementById('onlyTargetChip').addEventListener('click', ()=>{ state.filter.onlyTarget=!state.filter.onlyTarget; render(); });
    document.querySelectorAll('thead th[data-k]').forEach(th=>{
      th.addEventListener('click', ()=>{
        const k = th.dataset.k;
        state.sort.dir = (state.sort.key===k) ? -state.sort.dir : -1;
        state.sort.key = k; render();
      });
    });
    document.getElementById('resetOverrides').addEventListener('click', ()=>{
      currentSet().forEach(r=>delete state.targets[r.id]); saveTargets(); render();
    });
    document.getElementById('exportCsv').addEventListener('click', ()=>{
      const rows = filteredSortedSet();
      const csv = toCsv(rows, [
        {h:'Юрлицо', v:r=>r.org},{h:'Адрес', v:r=>r.addr},{h:'Город', v:r=>r.city},
        {h:'Сеть', v:r=>r.net},{h:'Группа Ядран', v:r=>r.grp},{h:'Категория ТО', v:r=>r.toCat},
        {h:'Ср.чек', v:r=>r.chk},{h:'ЛП%', v:r=>r.lp},{h:'БАД%', v:r=>r.bad},
        {h:'Скоринг', v:r=>r.score},{h:'Приоритет', v:r=>r.tier},{h:'Целевая', v:r=>isTargeted(r)?'Да':'Нет'},
      ]);
      downloadCsv(csv, `territory_${state.region}.csv`);
    });
    bindRowChecks();
  }
  if(tab==='whitespace'){ bindRowChecks(); }
  if(tab==='route'){
    const sel = document.getElementById('routeCitySel');
    if(sel) sel.addEventListener('change', e=>{ state._routeCity = e.target.value; render(); });
    document.querySelectorAll('.moveUp,.moveDown').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const li = e.target.closest('.route-item');
        const list = [...document.querySelectorAll('#routeList .route-item')];
        const idx = list.indexOf(li);
        const swapIdx = btn.classList.contains('moveUp')? idx-1: idx+1;
        if(swapIdx<0 || swapIdx>=list.length) return;
        const targeted = currentSet().filter(isTargeted);
        const byCity = groupBy(targeted, r=>r.city);
        const city = state._routeCity || Object.keys(byCity)[0];
        let order = getRouteOrder(city, byCity[city]||[]);
        [order[idx], order[swapIdx]] = [order[swapIdx], order[idx]];
        setRouteOrder(city, order);
        render();
      });
    });
    const exportBtn = document.getElementById('exportRoute');
    if(exportBtn) exportBtn.addEventListener('click', ()=>{
      const targeted = currentSet().filter(isTargeted);
      const byCity = groupBy(targeted, r=>r.city);
      const city = state._routeCity || Object.keys(byCity)[0];
      const order = getRouteOrder(city, byCity[city]||[]);
      const csv = toCsv(order.map((r,i)=>({...r, idx:i+1})), [
        {h:'№', v:r=>r.idx},{h:'Юрлицо', v:r=>r.org},{h:'Адрес', v:r=>r.addr},
        {h:'Скоринг', v:r=>r.score},{h:'Приоритет', v:r=>r.tier},
      ]);
      downloadCsv(csv, `route_${state.region}_${city}.csv`);
    });
  }
}
function bindRowChecks(){
  document.querySelectorAll('.targetChk').forEach(chk=>{
    chk.addEventListener('change', e=>{
      const id = Number(e.target.dataset.id);
      state.targets[id] = e.target.checked;
      saveTargets();
      render();
    });
  });
}

boot();
</script>
</body>
</html>
